<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kelime Öğren</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1> Kelime Öğren</h1>

    <!-- Sekmeler -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="learn">📖 Öğren</button>
      <button class="tab-btn" data-tab="manage">⚙️ Kelimeler</button>
    </div>

    <!-- SEKME 1: ÖĞREN -->
    <div class="tab-content active" id="tab-learn">
      <div class="word-card">
        <div class="word-en" id="wordEn">—</div>
        <div class="word-tr" id="wordTr">—</div>
      </div>
      <button id="nextBtn">🔄 Sonraki Kelime</button>

      <div class="settings">
        <label>
          Bildirim Aralığı (dakika):
          <input type="number" id="intervalInput" value="5" min="1" max="60">
        </label>
        <div class="btn-row">
          <button id="startBtn">▶ Başlat</button>
          <button id="stopBtn">⏹ Durdur</button>
        </div>
      </div>
      <div class="status" id="status">Bildirim kapalı</div>
    </div>

    <!-- SEKME 2: KELİMELER -->
    <div class="tab-content" id="tab-manage">
      <div class="add-form">
        <h3>➕ Yeni Kelime Ekle</h3>
        <input type="text" id="inputEn" placeholder="İngilizce kelime">
        <input type="text" id="inputTr" placeholder="Türkçe karşılık">
        <button id="addBtn">Ekle</button>
      </div>

      <div class="import-export">
        <h3>📁 CSV İşlemleri</h3>
        <div class="btn-row">
          <button id="exportBtn">⬇️ CSV İndir</button>
          <label for="importFile" class="file-label">⬆️ CSV Yükle</label>
          <input type="file" id="importFile" accept=".csv" hidden>
        </div>
      </div>

      <div class="word-list-section">
        <h3>📋 Kelime Listesi (<span id="wordCount">0</span>)</h3>
        <div class="word-list" id="wordList"></div>
      </div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="popup.js"></script>
</body>
</html>
